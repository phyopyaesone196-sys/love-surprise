<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Charlotte ❤️</title>

<style>
/* RESULT PAGE */

#result{

    display:none;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    height:100vh;

}


#result h2{

    font-size:48px;
    margin-bottom:20px;

}


#result p{

    font-size:22px;

    margin-bottom:30px;

    max-width:700px;

    padding:0 20px;

    line-height:1.8;

}


/* SONG BUTTON */

.song{

    background:white;

    color:#ff1744;

    padding:15px 35px;

    border-radius:40px;

    text-decoration:none;

    font-size:22px;

    font-weight:bold;

}


/* FALLING HEART */

.heart{

    position:absolute;

    color:#ff1744;

    font-size:20px;

    animation:fall linear infinite;

}


@keyframes fall{

    0%{

        transform:translateY(-100px);

        opacity:1;

    }


    100%{

        transform:translateY(110vh);

        opacity:0;

    }

}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:linear-gradient(135deg,#ff4d6d,#ff758f);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;

}


/* INTRO SCREEN */

#intro{

    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:#ff4d6d;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:9999;

}


#intro h1{

    font-size:34px;
    margin-bottom:20px;

}


#intro p{

    font-size:22px;
    animation:blink 1s infinite;

}


@keyframes blink{

    50%{

        opacity:0;

    }

}


/* MAIN PAGE */

#main{

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

}


h1{

    font-size:3rem;
    margin-bottom:40px;
    text-shadow:0 0 20px white;

}


.buttons{

    position:relative;
    width:350px;
    height:200px;

}


button{

    padding:15px 35px;
    font-size:24px;

    border:none;
    border-radius:50px;

    cursor:pointer;

    transition:.3s;

}


#yes{

    background:#ff1744;
    color:white;

    box-shadow:0 0 20px white;

}


#yes:hover{

    transform:scale(1.1);

}


#no{

    background:white;
    color:#ff1744;

    position:absolute;

    left:200px;
    top:0;

}
