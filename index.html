<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Charlotte ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
}


/* Floating Hearts */

.heart{
    position:absolute;
    bottom:-50px;
    color:white;
    font-size:25px;
    animation:float 8s linear infinite;
    opacity:0.8;
}

@keyframes float{

0%{
    transform:translateY(0) rotate(0deg);
}

100%{
    transform:translateY(-120vh) rotate(360deg);
}

}


/* Screens */

.screen{

height:100vh;
width:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
position:absolute;
transition:1s;

}


.hidden{

opacity:0;
pointer-events:none;
transform:scale(0.8);

}


/* Intro */

h1{

color:white;
font-size:35px;
margin-bottom:30px;

}


button{

border:none;
padding:15px 35px;
border-radius:50px;
font-size:20px;
cursor:pointer;
background:white;
color:#ff4b6e;
box-shadow:0 5px 20px rgba(0,0,0,0.2);

transition:0.3s;

}


button:hover{

transform:scale(1.1);

}


/* Love Question */


#question{

font-size:38px;

}


#buttons{

margin-top:40px;
display:flex;
gap:30px;

}


#yesBtn{

background:#ff4b6e;
color:white;

}


#noBtn{

background:white;
position:absolute;

}


/* Letter */

.letter{

background:white;
width:90%;
max-width:600px;
padding:30px;
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,0.2);

font-size:18px;
line-height:1.7;
color:#555;

}


.title{

font-size:35px;
color:white;
margin-bottom:20px;

}


/* Final */

.finalText{

font-size:40px;
color:white;

}


#musicBtn{

margin-top:30px;

}


@media(max-width:600px){

h1{
font-size:28px;
}


#question{
font-size:30px;
}


.finalText{
font-size:32px;
}


.letter{
font-size:16px;
}

}

</style>

</head>


<body>


<!-- Floating Hearts -->

<div class="heart" style="left:10%;animation-delay:0s;">❤️</div>
<div class="heart" style="left:30%;animation-delay:2s;">💖</div>
<div class="heart" style="left:50%;animation-delay:4s;">💕</div>
<div class="heart" style="left:70%;animation-delay:1s;">❤️</div>
<div class="heart" style="left:90%;animation-delay:3s;">💗</div>


<!-- Intro Screen -->

<div class="screen" id="intro">

<h1>
A little surprise is waiting for Charlotte... ❤️
</h1>

<button onclick="startLove()">
Start Surprise 💝
</button>

</div>
